# Hourly: asks the app to start the job searches that are due (in each user's own time zone) and to
# keep drafting. The app decides what is due; this only knocks. Vercel's free cron runs once a day at
# most, so the schedule lives here.
#
# Needs one repository secret, JOB_SEARCH_CRON_SECRET (the same value as the Vercel environment
# variable, 32+ characters); without it the job does nothing. The app's address is public, so it is
# written here; a repository variable APP_URL overrides it.
name: Job search schedule

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  knock:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Start due searches
        env:
          APP_URL: ${{ vars.APP_URL || 'https://job-application-tracker-eta-one.vercel.app' }}
          SECRET: ${{ secrets.JOB_SEARCH_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$SECRET" ]; then
            echo "JOB_SEARCH_CRON_SECRET is not set; nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 320 \
            -X POST "${APP_URL%/}/api/cron/job-search" \
            -H "x-cron-secret: $SECRET" \
            -H 'content-type: application/json' \
            -d '{}'
