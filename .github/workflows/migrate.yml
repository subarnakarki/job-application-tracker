# Applies pending database migrations to Neon over the DIRECT (unpooled) connection.
# Manual for now; Phase 13 turns this into the deploy-time migration job.
name: Migrate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run migrations
        run: npm run db:migrate -w @jat/server
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
