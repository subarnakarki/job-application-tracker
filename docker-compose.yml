# Local Postgres for development and tests (used from Phase 2).
# Credentials are throwaway and local-only.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: jat
      POSTGRES_PASSWORD: jat
      POSTGRES_DB: jat
    ports:
      # Override with JAT_DB_PORT when 5432 is taken (e.g. a native Postgres install).
      - '${JAT_DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jat -d jat']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
