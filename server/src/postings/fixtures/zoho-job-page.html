icare Advantage, or total cost of care.\\n     <br><\\\/li>\\n    <li>Tableau dashboard testing experience; Exasol or comparable analytical database experience.\\n     <br><\\\/li>\\n    <li>Familiarity with HEDIS or eCQM quality measures.\\n     <br><\\\/li>\\n   <\\\/ul>\\n   <p dir=\\\x22ltr\\\x22><b>Ideal Candidate Profile<\\\/b>\\n    <br><\\\/p>\\n   <ul dir=\\\x22ltr\\\x22>\\n    <li>Methodical, numbers\-first QA professional who won\\u2019t sign off until the data ties.\\n     <br><\\\/li>\\n    <li>Experienced running both internal testing and client\-facing UAT in a healthcare data environment.\\n     <br><\\\/li>\\n    <li>Comfortable holding a 72\-hour defect turnaround standard and escalating blockers to the PMO early.\\n     <br><\\\/li>\\n    <li>SQL\-fluent and able to trace a dashboard figure back through transformations to source claims independently.\\n     <br><\\\/li>\\n    <li>Clear communicator who can translate test status and defect risk into terms project leadership can act on.\\n     <br><\\\/li>\\n   <\\\/ul>\\n   <p dir=\\\x22ltr\\\x22>When working with Quoris as a consultant, you are eligible for competitive benefits including Health, Dental, Vision, 401k, and a great culture\/working environment.\\n    <br><\\\/p>\\n   <p dir=\\\x22ltr\\\x22>\\n    <br>\\n   <\\\/p>\\n   <div>\\n    #LI\-JG1\\n    <br>\\n   <\\\/div>\\n   <div>\\n    #LI\-Remote\\n    <br>\\n   <\\\/div>\\n   <p>\\n    <br>\\n   <\\\/p>\\n   <div>\\n    <br>\\n   <\\\/div>\\n  <\\\/span>\\n  <br>\\n <\\\/body>\\n<\\\/html>\x22,\x22Work_Experience\x22:\x225+ years\x22,\x22Job_Type\x22:\x22Contract\x22,\x22Job_Opening_Name\x22:\x22Healthcare QA Testing Lead\x22,\x22State\x22:null,\x22Country\x22:null,\x22Zip_Code\x22:null,\x22id\x22:\x22837266000007382093\x22,\x22Publish\x22:true,\x22Date_Opened\x22:\x222026\-10\-30\x22,\x22Keep_on_Career_Site\x22:false}]');
